name: CI

# Two jobs, because the physics core needs no npm and the browser suite needs no Rust.
#
# The two exclusions this file used to carry are both resolved, and the reasons are worth
# keeping because they are the kind of thing that reappears:
#   - the app-side harnesses launched a hardcoded /usr/bin chromium, so they could not run here;
#     they resolve a browser portably now and run in the browser job through verify-app.js.
#   - verify-spin.js reported FAIL on a clean clone. It was not the model: its english values
#     (+-0.5) ended just inside its own thresholds. Fixed, and it is judged by verify-core.js.
# verify-doc-claims.js and verify-test-hygiene.js exist because five doc claims and several
# assertions that could not fail were found in one pass - they guard the habits now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  physics:
    name: Physics core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain so a rebuild of unchanged source produces the
      # same bytes - embed-wasm.js commits those bytes into index.html, so a different rustc
      # would mean base64 churn. Two checks below cover the two questions: the behavioural one is
      # host-agnostic, and the byte gate is exact *because* this job is where the bytes come from
      # (option 2, taken 2026-10-16). Before that, the byte comparison was red here for a core
      # that was not stale - the code section depends on the compiling host (measured 2026-10-14,
      # see NEXT_STEPS.md).
      - name: Install the pinned toolchain and wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the core
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path ace-physics/Cargo.toml

      - name: Core unit tests
        run: cargo test --release --manifest-path ace-physics/Cargo.toml

      # Runs the shot battery through the embedded core and the fresh build and requires the
      # same shots, so this is host-agnostic. Its exit code is trustworthy: the script sets
      # process.exitCode instead of calling process.exit, which after wasm instantiation aborts
      # during teardown on this node version.
      - name: The embedded core behaves like the build
        run: node verify-wasm-embed.js

      # Option 2 of the embed-check menu (2026-10-14), taken 2026-10-16: the bytes' one home is CI.
      # The wasm's code section depends on the compiling host, so a byte comparison can only be exact
      # when the committed core was built *here* - and from now on it was, because the artifact below
      # is where the canonical bytes come from. The behavioural check above stays the host-agnostic
      # one; this gate is the exact one. When it fails, download `ci-built-core` from the run and
      # commit its index.html (or run `node embed-wasm.js` with its ace_physics.wasm in place).
      - name: The committed core is the CI-built core
        run: node embed-wasm.js --check

      # verify-rust-parity.js prints its verdict and then aborts during process teardown,
      # so its exit code is not a verdict; verify-core.js judges what it printed instead and
      # still fails if the crash happens before the summary.
      - name: Physics battery through the wasm
        run: node verify-core.js

      # Last in the job, because it rewrites index.html: the embed writes the CI-built core into the
      # file, so the artifact carries something that can be committed as-is. Runs even when the byte
      # gate above failed - that is exactly when these bytes are wanted.
      - name: Package the canonical core and index.html
        if: always()
        run: |
          node embed-wasm.js
          mkdir -p ci-built-core
          cp ace-physics/target/wasm32-unknown-unknown/release/ace_physics.wasm ci-built-core/
          cp index.html ci-built-core/
          ls -l ci-built-core

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-built-core
          path: ci-built-core/
          retention-days: 30

  browser:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: App-side harnesses (Shoot, the break, shot types)
        run: node verify-app.js
      - name: Doc claims and test hygiene
        run: node verify-doc-claims.js && node verify-test-hygiene.js
      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
